name: Build APK and website

on:
  push:
    branches: [main, "feature/durban-vehicle-expansion"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the JavaScript
        run: npm test
      # Vehicles ship as pre-optimised GLBs in src/assets/vehicles/ (made from
      # models/import/*.zip by scripts/optimize-vehicles.mjs), so no unzip step.
      - name: Copy the game into the app
        run: |
          A=android/app/src/main/assets
          mkdir -p $A/src/data
          cp index.html $A/
          cp -r vendor $A/
          rsync -a --exclude data src/ $A/src/
          # every runtime data file (the raw OSM dump and caches stay out)
          rsync -a --exclude durban-osm.json --exclude places-raw.json --exclude cache src/data/ $A/src/data/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk eThekwini-Drive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eThekwini-Drive-apk
          path: eThekwini-Drive.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest eThekwini-Drive.apk \
            --title "Latest test APK (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}" --target ${{ github.sha }}

      # ---- Play Store App Bundle (unsigned) ----
      # The APK above keeps the HD textures inside the app. For the bundle they
      # move into the install-time asset pack at the same asset path
      # (src/assets/hd/), so WebViewAssetLoader still serves /assets/src/assets/hd/.
      - name: Move HD textures into the asset pack
        run: |
          du -sh android/app/src/main/assets/src/assets/hd
          mkdir -p android/hd_assets/src/main/assets/src/assets
          mv android/app/src/main/assets/src/assets/hd android/hd_assets/src/main/assets/src/assets/hd
          ls -la android/hd_assets/src/main/assets/src/assets/hd
      - name: Build App Bundle (unsigned)
        run: |
          gradle -p android bundleRelease --no-daemon
          ls -la android/app/build/outputs/bundle/release/
          cp android/app/build/outputs/bundle/release/app-release.aab eThekwini-Drive-unsigned.aab
          ls -la eThekwini-Drive.apk eThekwini-Drive-unsigned.aab
      - name: Check the bundle splits with bundletool
        run: |
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          # throwaway key, only so bundletool can build the check APKs
          keytool -genkeypair -keystore check.jks -storepass checkpass -keypass checkpass \
            -alias check -keyalg RSA -keysize 2048 -validity 1 -dname "CN=bundle check" -noprompt
          echo '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en"],"screenDensity":480,"sdkVersion":34}' > device.json
          java -jar bundletool.jar build-apks --bundle=eThekwini-Drive-unsigned.aab --output=check.apks \
            --device-spec=device.json --ks=check.jks --ks-pass=pass:checkpass --ks-key-alias=check --key-pass=pass:checkpass
          echo "== split APKs for arm64-v8a / 480 dpi / en =="
          unzip -l check.apks
          java -jar bundletool.jar get-size total --apks=check.apks --device-spec=device.json || true
          rm -f check.jks check.apks
      - uses: actions/upload-artifact@v4
        with:
          name: eThekwini-Drive-aab-unsigned
          path: eThekwini-Drive-unsigned.aab
      - name: Attach the bundle to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload apk-latest eThekwini-Drive-unsigned.aab --clobber

  website:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the game files
        run: |
          mkdir -p site/src/data
          cp index.html site/
          cp -r vendor site/
          rsync -a --exclude data src/ site/src/
          # every runtime data file (the raw OSM dump and caches stay out)
          rsync -a --exclude durban-osm.json --exclude places-raw.json --exclude cache src/data/ site/src/data/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
