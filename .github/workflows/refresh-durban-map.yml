name: Refresh Durban offline map data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-durban-map
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data scripts
        run: |
          node --check scripts/fetch-osm.mjs
          node --check scripts/fetch-places.mjs
          node --check scripts/build-data.mjs
      - name: Download all 12 Durban road zones and coastline
        run: node scripts/fetch-osm.mjs
      - name: Download real land-cover polygons and place labels
        run: node scripts/fetch-places.mjs
      - name: Build compact offline game map
        run: node scripts/build-data.mjs
      - name: Run project checks
        run: npm test
      - name: Commit refreshed map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/durban-osm.json src/data/durban-game.json src/data/places-raw.json src/data/cache/landcover-v2.json
          if git diff --cached --quiet; then
            echo "Map data is already up to date."
          else
            git commit -m "Refresh complete Durban offline road map data"
            # Rebase generated map data onto main if code commits landed during downloads.
            for attempt in 1 2 3 4 5; do
              git fetch origin "${{ github.ref_name }}"
              git rebase "origin/${{ github.ref_name }}"
              if git push origin HEAD:${{ github.ref_name }}; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not publish refreshed map data after 5 attempts."
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi
