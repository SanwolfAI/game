name: Refresh Durban land-cover data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-durban-landcover
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate land-cover data scripts
        run: |
          node --check scripts/fetch-places.mjs
          node --check scripts/build-data.mjs
      - name: Download Durban land-cover polygons and place labels
        run: node scripts/fetch-places.mjs
      - name: Rebuild the offline game map using existing road data
        run: node scripts/build-data.mjs
      - name: Run project checks
        run: npm test
      - name: Commit refreshed land-cover data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/durban-game.json src/data/places-raw.json src/data/cache/landcover-v3.json
          if git diff --cached --quiet; then
            echo "Land-cover data is already up to date."
          else
            git commit -m "Refresh Durban parks, forests and farmland data"
            # Rebase generated data onto main if development commits landed during downloads.
            for attempt in 1 2 3 4 5; do
              git fetch origin "${{ github.ref_name }}"
              git rebase "origin/${{ github.ref_name }}"
              if git push origin HEAD:${{ github.ref_name }}; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not publish refreshed land-cover data after 5 attempts."
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi
