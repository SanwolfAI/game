<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0d1620" />
    <link rel="icon" href="data:," />
    <title>Izinja zase Kasi (IZK) — Durban</title>
    <style>
      :root {
        --ink: #f4f7fa;
        --dim: #93a4b5;
        --accent: #ffcf5c;
        --panel: rgba(10, 18, 26, 0.62);
        --edge: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1620;
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .panel {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 14px;
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.32);
      }

      #hud { position: absolute; inset: 0; pointer-events: none; }

      #place {
        position: absolute;
        top: 14px;
        left: 198px;
        padding: 10px 16px;
        min-width: 168px;
      }
      #place-name {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.3px;
        line-height: 1.15;
      }
      #place-kind {
        margin-top: 2px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.6px;
        color: var(--accent);
      }
      #coords, #clock {
        margin-top: 5px;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }

      #clock-box {
        position: absolute;
        top: 14px;
        right: 14px;
        padding: 10px 14px;
        text-align: right;
      }
      #clock { margin: 0; color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
      #clock-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); }
      #date { margin-top: 3px; font-size: 11px; color: var(--dim); letter-spacing: 0.4px; }
      #season { margin-top: 1px; font-size: 11px; color: var(--accent); letter-spacing: 0.6px; }

      #dest {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 10px;
        padding: 8px 16px 8px 12px;
        min-width: 150px;
      }
      #dest.show { display: flex; }
      #dest-arrow {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        color: var(--accent);
        transform-origin: center;
        transition: transform 0.1s linear;
      }
      #dest-name {
        max-width: 190px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      #dest-distance {
        margin-top: 1px;
        font-size: 11px;
        letter-spacing: 1px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }

      #speedo {
        position: absolute;
        left: 14px;
        bottom: 14px;
        padding: 12px 18px 14px;
        min-width: 156px;
      }
      #speed-row { display: flex; align-items: baseline; gap: 8px; }
      #speed-val {
        font-size: 42px;
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      #speed-unit { font-size: 12px; letter-spacing: 1.5px; color: var(--dim); }
      #speed-bar {
        margin-top: 9px;
        height: 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #speed-fill {
        height: 100%;
        width: 0%;
        border-radius: 4px;
        background: linear-gradient(90deg, #4fd47a, #ffcf5c 62%, #ff6b57);
        transition: width 0.08s linear;
      }

      #map-box {
        position: absolute;
        left: 14px;
        top: 14px;
        padding: 8px;
        line-height: 0;
      }
      #minimap { width: 168px; height: 168px; border-radius: 9px; }

      #help {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 8px 16px;
        font-size: 12px;
        letter-spacing: 0.4px;
        color: var(--dim);
        text-align: center;
        white-space: nowrap;
        transition: opacity 0.8s ease;
      }
      #help b { color: var(--ink); font-weight: 600; }
      #help.hidden { opacity: 0; }

      #toast {
        position: absolute;
        left: 50%;
        top: 78px;
        transform: translate(-50%, -10px);
        padding: 9px 18px;
        font-size: 13px;
        letter-spacing: 0.5px;
        opacity: 0;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }

      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 35%, #16304a 0%, #0a1119 72%);
        z-index: 20;
        transition: opacity 0.6s ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 58px);
        letter-spacing: 2px;
        font-weight: 800;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
      }
      #loading h1 span { color: var(--accent); }
      #loading p { margin: 0; color: var(--dim); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; }
      #load-track {
        width: min(340px, 70vw);
        height: 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #load-fill {
        width: 3%;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #4fd47a, var(--accent));
        transition: width 0.3s ease;
      }
      #load-status { font-size: 11px; color: var(--dim); letter-spacing: 1px; min-height: 14px; }

      #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
      #touch .tbtn {
        position: absolute;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        font-size: 22px;
        font-weight: 700;
        color: var(--ink);
        background: rgba(12, 22, 32, 0.55);
        border: 1px solid var(--edge);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        touch-action: none;
      }
      #touch .tbtn.active { background: rgba(255, 207, 92, 0.34); }
      #touch .tbtn.small { width: 52px; height: 52px; font-size: 11px; letter-spacing: 0.5px; }
      /* ---- Steering wheel (SVG, rotates with the finger) ---- */
      #t-wheel {
        position: absolute;
        pointer-events: auto;
        left: 18px;
        bottom: 18px;
        width: 168px;
        height: 168px;
        border-radius: 50%;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #t-wheel::before {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(12, 22, 32, 0) 58%, rgba(12, 22, 32, 0.28) 62%, rgba(12, 22, 32, 0) 72%);
      }
      #t-wheel-inner { position: absolute; inset: 0; will-change: transform; }
      #t-wheel-inner svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45)); }
      #t-wheel.active #t-wheel-inner svg { filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.55)) brightness(1.08); }

      /* ---- Pedals: brushed aluminium with rubber grip strips ---- */
      #touch .pedal {
        position: absolute;
        pointer-events: auto;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        --press: 0;
        border-radius: 12px 12px 16px 16px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background:
          repeating-linear-gradient(180deg, rgba(20, 22, 25, 0.55) 0 5px, rgba(0, 0, 0, 0) 5px 11px) 10% 12% / 80% 70% no-repeat,
          linear-gradient(160deg, #e3e8ec 0%, #a8b0b6 45%, #868e94 100%);
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.18), 0 6px 14px rgba(0, 0, 0, 0.45);
        transform-origin: 50% 100%;
        transform: perspective(320px) rotateX(calc(var(--press) * 24deg)) scale(calc(1 - var(--press) * 0.05));
        color: #1b2127;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.2px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 6px;
        overflow: hidden;
      }
      #touch .pedal::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: calc(var(--press) * 100%);
        background: var(--pedal-tint);
        opacity: 0.38;
        pointer-events: none;
      }
      #t-gas { right: 18px; bottom: 18px; width: 62px; height: 128px; --pedal-tint: #4fd47a; }
      #t-brake { right: 94px; bottom: 18px; width: 86px; height: 100px; --pedal-tint: #ff6b57; }

      /* ---- Gear selector (automatic: R / N / D) ---- */
      #t-gear {
        position: absolute;
        right: 194px;
        bottom: 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 5px;
        pointer-events: auto;
        border-radius: 12px;
      }
      .gear-btn {
        width: 40px;
        height: 30px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(12, 22, 32, 0.72);
        font: 800 14px "Trebuchet MS", system-ui, sans-serif;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      .gear-btn.active { color: #17202a; background: var(--accent); }
      .gear-btn[data-gear="R"].active { background: #ff8a6b; }

      #t-hand { right: 18px; bottom: 160px; }
      #t-horn { right: 94px; bottom: 160px; }
      #t-interact { right: 18px; top: 104px; }
      #t-cam { right: 76px; top: 104px; }
      #t-cycle { right: 134px; top: 104px; }
      #t-gps { right: 192px; top: 104px; }
      #speed-gear {
        margin-left: auto;
        min-width: 22px;
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(255, 207, 92, 0.18);
        color: var(--accent);
        font-size: 14px;
        font-weight: 800;
        text-align: center;
      }
      #speed-gear:empty { display: none; }
      @media (pointer: coarse) {
        #touch { display: block; }
        #help { display: none; }
        /* Landscape phone (about 800 x 360): nothing may overlap. */
        #map-box { left: 10px; top: 10px; padding: 6px; }
        #minimap { width: 118px; height: 118px; }
        #place { left: 150px; top: 10px; padding: 7px 12px; min-width: 0; }
        #place-name { font-size: 15px; }
        #clock-box { top: 10px; right: 10px; padding: 7px 11px; }
        #dest { top: 10px; }
        #toast { top: 150px; }
        #speedo { left: 50%; right: auto; bottom: 10px; transform: translateX(-50%); min-width: 128px; padding: 7px 12px 8px; }
        #speed-val { font-size: 30px; }
        #t-wheel { left: 14px; bottom: 12px; width: 150px; height: 150px; }
        #t-gas { right: 12px; bottom: 12px; width: 58px; height: 118px; }
        #t-brake { right: 80px; bottom: 12px; width: 78px; height: 92px; }
        #t-gear { right: 168px; bottom: 12px; }
        #touch #t-hand, #touch #t-horn { width: 52px; height: 52px; font-size: 11px; }
        #t-hand { right: 12px; bottom: 142px; }
        #t-horn { right: 80px; bottom: 142px; }
        #touch .tbtn.small { width: 48px; height: 48px; font-size: 10px; }
        #t-interact { right: 12px; top: 92px; }
        #t-cam { right: 66px; top: 92px; }
        #t-cycle { right: 120px; top: 92px; }
        #t-gps { right: 174px; top: 92px; }
      }
      @media (max-width: 560px) {
        #place { left: 14px; top: 198px; }
        #clock-box { top: 198px; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="place" class="panel">
        <div id="place-name">eThekwini</div>
        <div id="place-kind">Durban</div>
        <div id="coords">-29.8587, 31.0218</div>
      </div>

      <div id="clock-box" class="panel">
        <div id="clock-label">Durban · day</div>
        <div id="clock">--:--</div>
        <div id="date">--</div>
        <div id="season">Summer</div>
      </div>

      <div id="dest" class="panel">
        <div id="dest-arrow">▲</div>
        <div>
          <div id="dest-name">—</div>
          <div id="dest-distance">—</div>
        </div>
      </div>

      <div id="speedo" class="panel">
        <div id="speed-row">
          <div id="speed-val">0</div>
          <div id="speed-unit">KM/H</div>
          <div id="speed-gear">D</div>
        </div>
        <div id="speed-bar"><div id="speed-fill"></div></div>
      </div>

      <div id="map-box" class="panel"><canvas id="minimap" width="336" height="336"></canvas></div>

      <div id="toast" class="panel"></div>
      <div id="help" class="panel">
        <b>W/S</b> gas/brake &nbsp; <b>R/N</b> gear &nbsp; <b>A/D</b> steer &nbsp; <b>Space</b> handbrake &nbsp; <b>H</b> horn &nbsp; <b>F</b> enter/exit &nbsp; <b>C</b> camera &nbsp; <b>V</b> vehicle &nbsp; <b>G</b> GPS
      </div>
    </div>

    <div id="touch">
      <div id="t-wheel" aria-label="Steering wheel">
        <div id="t-wheel-inner">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="wRim" cx="50%" cy="38%" r="60%">
                <stop offset="0%" stop-color="#4a4440" />
                <stop offset="70%" stop-color="#26221f" />
                <stop offset="100%" stop-color="#121010" />
              </radialGradient>
              <linearGradient id="wMetal" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#d6dbe0" />
                <stop offset="55%" stop-color="#8f979e" />
                <stop offset="100%" stop-color="#5d646a" />
              </linearGradient>
              <radialGradient id="wHub" cx="45%" cy="38%" r="65%">
                <stop offset="0%" stop-color="#3a3632" />
                <stop offset="100%" stop-color="#151312" />
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="43" fill="none" stroke="url(#wRim)" stroke-width="10" />
            <circle cx="50" cy="50" r="43" fill="none" stroke="#000" stroke-opacity="0.28" stroke-width="10" stroke-dasharray="0.7 2.4" />
            <circle cx="50" cy="50" r="47.6" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="0.8" />
            <path d="M50 50 L9 47 L9 55 L50 58 Z" fill="url(#wMetal)" />
            <path d="M50 50 L91 47 L91 55 L50 58 Z" fill="url(#wMetal)" />
            <path d="M46 52 L44 91 L56 91 L54 52 Z" fill="url(#wMetal)" />
            <circle cx="50" cy="52" r="14" fill="url(#wHub)" stroke="#9aa2a8" stroke-width="1.2" />
            <circle cx="50" cy="52" r="5" fill="none" stroke="#6b7177" stroke-width="1" />
            <rect x="47.6" y="2.6" width="4.8" height="9.8" rx="1.2" fill="#ffcf5c" />
          </svg>
        </div>
      </div>
      <div class="pedal" id="t-brake" data-action="brake">BRAKE</div>
      <div class="pedal" id="t-gas" data-action="gas">GAS</div>
      <div id="t-gear" class="panel" aria-label="Gear selector">
        <button class="gear-btn" type="button" data-gear="R">R</button>
        <button class="gear-btn" type="button" data-gear="N">N</button>
        <button class="gear-btn active" type="button" data-gear="D">D</button>
      </div>
      <div class="tbtn" id="t-hand" data-action="handbrake">DRIFT</div>
      <div class="tbtn" id="t-horn" data-action="horn" data-press="true">HORN</div>
      <div class="tbtn small" id="t-interact" data-action="interact" data-press="true">IN/OUT</div>
      <div class="tbtn small" id="t-cam" data-action="camera" data-press="true">CAM</div>
      <div class="tbtn small" id="t-cycle" data-action="cycle" data-press="true">CAR</div>
      <div class="tbtn small" id="t-gps" data-action="destination" data-press="true">GPS</div>
    </div>

    <div id="loading">
      <h1>Izinja <span>zase Kasi</span></h1>
      <p>IZK · Durban, KwaZulu-Natal</p>
      <div id="load-track"><div id="load-fill"></div></div>
      <div id="load-status">Starting engine…</div>
    </div>

    <script>
      // Classic (non-module) boot guard: shows any startup error on the loading
      // screen instead of hanging at "Starting engine…" (Android WebView).
      (function () {
        var status = document.getElementById('load-status');
        var fill = document.getElementById('load-fill');
        window.__izkBooted = false;
        function show(msg) {
          if (!status || window.__izkBooted) return;
          status.textContent = 'Failed: ' + msg;
          status.style.color = '#ffb4a8';
          status.style.whiteSpace = 'normal';
          if (fill) { fill.style.width = '100%'; fill.style.background = '#ff6b57'; }
        }
        window.__izkShowError = show;
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) {
            var u = String(t.src || t.href);
            show(/main\.js$/.test(u) ? 'could not load the game scripts (src/main.js or one of the files it imports). Reinstall/update the app.' : 'could not load ' + u);
            return;
          }
          show((e.message || 'script error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show(r && r.message ? r.message : String(r));
        });
        // Watchdog: if main.js never started (module not supported / import failed).
        setTimeout(function () {
          if (!window.__izkStarted) show('game modules did not start. This WebView may be too old (needs ES modules) or a script failed to load.');
        }, 20000);
      })();
    </script>
    <script nomodule>
      document.getElementById('load-status').textContent = 'Failed: this browser/WebView does not support ES modules. Please update Android System WebView or Chrome.';
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
