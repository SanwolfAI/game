plugins { id 'com.android.application' }

def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.sanwolf.ethekwinidrive'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sanwolf.ethekwinidrive'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "0.1.${run}"
    }
    // Optional stable signing key, supplied by CI secrets (never committed).
    // Without it Gradle uses its default debug key, so the APK still builds.
    def ksPath = System.getenv("IZK_KEYSTORE_PATH")
    def hasKs = ksPath && file(ksPath).exists()
    signingConfigs {
        if (hasKs) {
            release_test {
                storeFile file(ksPath)
                storeType 'pkcs12'
                storePassword System.getenv("IZK_KEYSTORE_PASSWORD")
                keyAlias System.getenv("IZK_KEY_ALIAS")
                keyPassword System.getenv("IZK_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { if (hasKs) signingConfig signingConfigs.release_test }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
