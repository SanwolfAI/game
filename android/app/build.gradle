plugins { id 'com.android.application' }

def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.sanwolf.ethekwinidrive'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sanwolf.ethekwinidrive'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "0.1.${run}"
    }
    signingConfigs {
        // Test key only (kept the same so each new APK installs over the last one).
        test {
            storeFile file('test-key.p12')
            storeType 'pkcs12'
            storePassword 'sanwolftest'
            keyAlias 'sanwolftest'
            keyPassword 'sanwolftest'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.test }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
